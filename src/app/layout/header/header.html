<header class="header">
  <div class="header-copy">
    <h1>Módulo de Gestión de Trámites</h1>
    <p>Maqueta funcional para visualización y validación del flujo.</p>
  </div>

  <section class="user-card" aria-label="Usuario conectado">
    <div
      class="user-avatar"
      role="img"
      [attr.aria-label]="'Avatar de ' + user().fullName"
    >
      {{ user().initials }}
      <span class="user-status" aria-hidden="true"></span>
    </div>

    <div class="user-copy">
      <span class="user-label">Usuario conectado</span>
      <strong>{{ user().fullName }}</strong>
      <span class="user-role">{{ user().role }}</span>
    </div>

    <button
      class="sign-out-button"
      type="button"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
      (click)="signOut()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10"
        ></path>
        <path d="M13.5 8.5 17 12l-3.5 3.5M9 12h8"></path>
      </svg>
    </button>
  </section>
</header>
