<section class="all-managements-page" aria-labelledby="all-managements-title">
  <app-breadcrumbs [items]="breadcrumbs" />

  <header class="page-heading">
    <div>
      <span class="scope-label">Vista global</span>
      <div class="page-title-row">
        <h1 id="all-managements-title">Todas las gestiones</h1>
        <app-gestion-alcance-info
          [titulo]="tituloInformacionAlcance"
          [texto]="informacionAlcance"
          ariaLabel="Información sobre todas las gestiones"
        />
      </div>
    </div>
  </header>

  @if (errorMessage) {
  <div class="page-error" role="alert">
    <p>{{ errorMessage }}</p>
    <button type="button" class="page-error__retry" (click)="cargar()">Reintentar</button>
  </div>
  } @else {
  <app-gestion-listado
    [gestiones]="gestiones"
    [loading]="loading"
    titulo="Gestiones de la organización"
    ariaLabelBusqueda="Buscar en todas las gestiones"
    ariaLabelTabla="Tabla de todas las gestiones"
    [mostrarResponsableInterno]="true"
    [detalleInicialId]="tramiteDetalleInicialId"
    [idEstacionInicial]="idEstacionInicial"
    mensajeSinGestiones="No hay gestiones registradas."
  />
  }
</section>
