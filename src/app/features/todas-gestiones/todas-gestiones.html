<section class="all-managements-page" aria-labelledby="all-managements-title">
  <app-breadcrumbs [items]="breadcrumbs" />

  <header class="page-heading">
    <div>
      <span class="scope-label">Vista global</span>
      <h1 id="all-managements-title">Todas las gestiones</h1>
    </div>
  </header>

  <app-gestion-listado
    [gestiones]="gestiones"
    titulo="Gestiones de la organización"
    ariaLabelBusqueda="Buscar en todas las gestiones"
    ariaLabelTabla="Tabla de todas las gestiones"
    [mostrarResponsableInterno]="true"
    [detalleInicialId]="tramiteDetalleInicialId"
    [idEstacionInicial]="idEstacionInicial"
  />
</section>
