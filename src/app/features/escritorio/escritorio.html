<section class="escritorio-page" aria-labelledby="escritorio-title">
  <app-breadcrumbs [items]="breadcrumbs" />

  <header class="page-heading">
    <div>
      <div class="page-title-row">
        <h1 id="escritorio-title">Escritorio</h1>
        <app-gestion-alcance-info
          [titulo]="tituloInformacionAlcance"
          [texto]="informacionAlcance"
          ariaLabel="Información sobre las gestiones de tu escritorio"
        />
      </div>
    </div>

    <div class="heading-summary" aria-label="Resumen del escritorio">
      <strong>{{ gestiones.length }}</strong>
      <span>gestiones asociadas</span>
    </div>
  </header>

  <app-gestion-listado
    [gestiones]="gestiones"
    titulo="Gestiones asociadas"
    ariaLabelBusqueda="Buscar en el escritorio"
    ariaLabelTabla="Tabla de gestiones asociadas"
    [mostrarCantidadResultados]="true"
    [bitacoraPersonal]="true"
  />
</section>
