<p-dialog
  [visible]="visible"
  (visibleChange)="actualizarVisibilidad($event)"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  closeAriaLabel="Cerrar bitácora"
  [draggable]="false"
  [resizable]="false"
  [blockScroll]="true"
  [style]="{ width: 'min(96vw, 1080px)', height: 'min(98vh, 900px)' }"
  styleClass="bitacora-dialog"
>
  <ng-template #header>
    <div class="dialog-title">
      <span class="dialog-title__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6 3.5h9.5a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2v-15Z"></path>
          <path d="M8 20.5c0-1.1.9-2 2-2h7.5M9.5 8h5M9.5 11.5h3.5"></path>
        </svg>
      </span>
      <div>
        <span class="dialog-title__eyebrow">Registro de novedades</span>
        <div class="dialog-title__heading">
          <h2>Bitácora</h2>
          @if (gestion) {
          <strong class="dialog-title__code">{{ gestion.codigo }}</strong>
          }
        </div>
        @if (gestion) {
        <p class="dialog-title__description">{{ gestion.descripcion }}</p>
        }
      </div>
    </div>
  </ng-template>

  @if (gestion) {
  <article class="bitacora" [attr.aria-label]="'Bitácora de ' + gestion.codigo">
    <div class="context-strip">
      <div class="context-strip__item">
        <span>Estación</span>
        <strong>{{ gestion.estacionServicio }}</strong>
      </div>
      <span class="context-strip__divider" aria-hidden="true"></span>
      <div class="context-strip__item">
        <span>Responsable</span>
        <strong>{{ gestion.responsableInterno }}</strong>
      </div>
    </div>

    <app-bitacora-panel
      class="bitacora-panel--compact"
      [entradas]="entradas"
      [contextoId]="gestion.id"
      idBase="bitacora-modal"
      [activo]="visible"
      (entradaRegistrada)="agregarEntrada($event)"
    />
  </article>
  }

  <ng-template #footer>
    <button type="button" class="secondary-button" (click)="cerrar()">
      Cerrar
    </button>
  </ng-template>
</p-dialog>
